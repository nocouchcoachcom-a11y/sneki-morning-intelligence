name: sneKI Morning Intelligence

on:
  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

concurrency:
  group: sneki-morning-intelligence-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt

      - name: Offline-Tests ausführen
        run: |
          python -m unittest discover -s tests -v

      - name: Quellen sammeln
        run: |
          python scripts/collector.py

      - name: Edition prüfen und erzeugen
        env:
          SNEKI_RANKING_MODE: hybrid
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/build_briefing.py

      - name: Generierte Daten validieren
        run: |
          if git diff --quiet -- data/morning-intelligence.json && \
             git ls-files --error-unmatch data/morning-intelligence.json >/dev/null 2>&1; then
            echo "Briefing in diesem Lauf unverändert; Legacy-Datei wird übersprungen."
            python scripts/validate_outputs.py --skip-briefing
          else
            if [ ! -f data/morning-intelligence.json ]; then
              echo "Briefing wurde entfernt oder nicht erzeugt."
              exit 1
            fi
            python scripts/validate_outputs.py
          fi

      - name: Offline-Tests nach Build ausführen
        run: |
          python -m unittest discover -s tests -v

      - name: Änderungen speichern
        run: |
          git config user.name "sneKI Morning Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Keine Datenänderung."
          else
            git commit -m "Update Morning Intelligence data"

            echo "Aktuellen Stand von main holen..."
            git fetch origin main

            echo "Eigene Datenänderung auf aktuellen main-Stand setzen..."
            git rebase origin/main

            echo "Änderungen nach main übertragen..."
            git push origin HEAD:main
          fi
